services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: karvaan-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - IS_CLOUD=true
      - DATABASE_URL=file:/app/data/karvaan.db
      - UPLOAD_DIR=/app/data/uploads
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - CLOUD_SYNC_KEYS=${CLOUD_SYNC_KEYS:-{}}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-admin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-Admin@Karvaan2026}
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
    volumes:
      - karvaan_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: karvaan-frontend
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  karvaan_data:
    driver: local
