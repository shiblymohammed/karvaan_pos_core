[package]
name = "karvaan-pos"
version = "1.0.0"
description = "Karvaan POS Desktop Application"
authors = ["Karvaan Team"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This is required for iOS to work.
name = "karvaan_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"

# Auto-updater (pulls from GitHub Releases)
tauri-plugin-updater = "2"

# SQLite — embedded local database (replaces NestJS for offline operation)
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"

# Serial port for thermal printer + cash drawer
serialport = "4.3"

[package.metadata.bundle]
name = "KarvaanPOS"
identifier = "com.karvaan.pos"
icon = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
resources = []
copyright = "Copyright (c) Karvaan 2025"
category = "Business"
short_description = "Restaurant POS System"
