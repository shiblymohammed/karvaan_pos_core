name: Verify POS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Generate database client
        run: npm run prisma:generate
        working-directory: backend
      - name: Audit production backend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Build backend
        run: npm run build
        working-directory: backend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Run HTTP, WebSocket, and browser storage regression tests
        run: npm test
        working-directory: backend
      - name: Verify print worker crash, acknowledgment and restore recovery
        run: node --test print-agent/test/*.test.cjs
      - name: Verify downloadable printing package
        run: python3 -c 'import zipfile; z=zipfile.ZipFile("frontend/dist/karvaan-print-agent.zip"); assert z.testzip() is None; assert "install-windows.ps1" in z.namelist(); assert "config.json" not in z.namelist()'
      - name: Check deployment scripts
        run: |
          for script in scripts/deploy-cloud.sh scripts/backup-cloud.sh backend/docker-entrypoint.sh; do
            bash -n "$script"
          done
      - name: Build deployment containers
        run: docker compose build
        env:
          JWT_SECRET: isolated-ci-build-secret-never-used-for-deployment
          SUPER_ADMIN_PASSWORD: isolated-ci-build-password
      - name: Verify container startup, proxy login, and backup restore
        env:
          JWT_SECRET: isolated-ci-build-secret-never-used-for-deployment
          SUPER_ADMIN_PASSWORD: isolated-ci-build-password
          PORT_HTTP: 8080
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 120
          curl --fail --silent http://localhost:8080/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"] == "ok"; assert h["capabilities"]["durablePrinting"] == 1'
          curl --fail --silent http://localhost:8080/karvaan-print-agent.zip -o /tmp/karvaan-print-agent.zip
          python3 -c 'import zipfile; z=zipfile.ZipFile("/tmp/karvaan-print-agent.zip"); assert z.testzip() is None; assert "SETUP.txt" in z.namelist()'
          curl --fail --silent -H 'Content-Type: application/json' -d '{"username":"admin","password":"isolated-ci-build-password"}' http://localhost:8080/auth/login | python3 -c 'import json,sys; assert json.load(sys.stdin)["accessToken"]'
          bash scripts/backup-cloud.sh
          restore_dir=$(mktemp -d)
          tar -xzf backups/karvaan_cloud_backup_*.tar.gz -C "$restore_dir"
          docker cp "$restore_dir/karvaan.db" karvaan-backend:/tmp/restore-check.db
          test "$(docker exec karvaan-backend sqlite3 /tmp/restore-check.db 'PRAGMA quick_check;')" = "ok"
          test "$(docker exec karvaan-backend sqlite3 /tmp/restore-check.db 'SELECT COUNT(*) FROM User WHERE role = "SUPER_ADMIN";')" = "1"
      - name: Container diagnostics and cleanup
        if: always()
        env:
          JWT_SECRET: isolated-ci-build-secret-never-used-for-deployment
          SUPER_ADMIN_PASSWORD: isolated-ci-build-password
          PORT_HTTP: 8080
        run: |
          docker compose logs --no-color
          docker compose down --volumes
  print-worker-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Windows worker recovery
        run: node --test print-agent/test/*.test.cjs
      - name: Parse installer and spooler scripts without installing or printing
        shell: powershell
        run: |
          $parseErrors = $null
          $parseTokens = $null
          foreach ($scriptPath in (Get-ChildItem -LiteralPath print-agent -Filter '*.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile($scriptPath.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
